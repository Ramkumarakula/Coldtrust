name: coldchain_ca

networks:
  coldchain_net:
    name: coldchain_net

services:
  ca_manufacturer:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-manufacturer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/manufacturer.coldchain.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca_manufacturer
    networks:
      - coldchain_net

  ca_transport:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-transport
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/transport.coldchain.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca_transport
    networks:
      - coldchain_net

  ca_retailer:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-retailer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/retailer.coldchain.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca_retailer
    networks:
      - coldchain_net

  ca_regulator:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-regulator
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
    ports:
      - "10054:10054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/regulator.coldchain.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca_regulator
    networks:
      - coldchain_net
